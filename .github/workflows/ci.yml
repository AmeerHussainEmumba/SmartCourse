name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smartcourse
          POSTGRES_PASSWORD: smartcourse
          POSTGRES_DB: smartcourse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smartcourse -d smartcourse"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # 1.26.11 rather than the go.mod floor (1.26.5): govulncheck reports
          # reachable standard-library vulnerabilities in net/http, crypto/tls,
          # crypto/x509 and others for every release below 1.26.11, so the
          # govulncheck step below cannot pass on 1.26.5. go.mod's `go 1.26.5`
          # is a minimum and stays as is.
          go-version: "1.26.11"
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Build (every module standalone, GOWORK=off)
        run: scripts/for-each-module.sh go build ./...

      - name: Vet
        run: scripts/for-each-module.sh go vet ./...

      - name: Link graph (each binary links only the modules it uses)
        run: make check-link-graph

      - name: Module graph (which modules may depend on which)
        run: make check-module-graph

      - name: Dockerfile COPY lists match each module's dependencies
        run: make check-dockerfile-modules

      - name: Module hygiene (go mod tidy no-op, replace targets, no version skew)
        run: make check-module-hygiene

      - name: Dev defaults and container policy (placeholder keys, seed guard, non-root, localhost ports)
        run: make check-dev-defaults

      - name: HTTP hardening (server timeouts, body cap, trusted proxies)
        run: make check-http-hardening

      - name: Pending E2E specs (no spec E1 to E14 is skipped past its phase)
        run: make check-pending-e2e

      - name: Guards fail on injected violations
        run: make test-guards

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-only: true

      - name: golangci-lint in every module (boundaries inside services/course, RFC §4.4)
        run: scripts/for-each-module.sh golangci-lint run ./...

      - name: Install govulncheck (pinned)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # govulncheck exits non-zero only for vulnerabilities whose vulnerable
      # symbol is actually called from the module's code; findings in packages
      # that are imported but not called, or in required modules that are not
      # even imported, are printed but do not fail the job. The vulnerability
      # database is live, so a new advisory can fail an unrelated PR: bump the
      # dependency (or the Go version above) rather than skipping the step.
      - name: govulncheck in every module (fails on reachable vulnerabilities only)
        run: scripts/for-each-module.sh govulncheck ./...

      - name: Run migrations
        run: |
          for svc in platform identity course analytics; do
            go run -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest \
              -path migrations/$svc \
              -database "postgres://smartcourse:smartcourse@localhost:5432/smartcourse?sslmode=disable&x-migrations-table=${svc}_schema_migrations" \
              up
          done

      - name: Unit + integration tests (race detector always on — RFC §10.6/§18.7)
        run: scripts/for-each-module.sh go test -race -tags=integration ./...
        env:
          POSTGRES_DSN: postgres://smartcourse:smartcourse@localhost:5432/smartcourse?sslmode=disable
          REDIS_ADDR: localhost:6379

      - name: Coverage report
        run: scripts/for-each-module.sh sh -c 'go test -race -tags=integration -coverprofile=coverage.out ./... && go tool cover -func=coverage.out | tail -1'
        env:
          POSTGRES_DSN: postgres://smartcourse:smartcourse@localhost:5432/smartcourse?sslmode=disable
          REDIS_ADDR: localhost:6379

  # The container tier of the Week 3 end-to-end scenarios (test/e2e/harness,
  # build tag `e2e`): real Postgres, Redis, Kafka, Schema Registry, MongoDB,
  # Mailpit and Temporal in Docker, and the real worker and API binaries run as
  # subprocesses. Separate from build-lint-test on purpose: it takes many
  # minutes and a dozen containers, and runs in parallel with it. Only tests
  # carrying the `e2e` tag run here (the main job's -tags=integration never
  # selects them).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: End-to-end scenarios (make test-e2e)
        run: make test-e2e
