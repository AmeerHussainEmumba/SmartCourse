name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smartcourse
          POSTGRES_PASSWORD: smartcourse
          POSTGRES_DB: smartcourse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smartcourse -d smartcourse"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # 1.26.11 rather than the go.mod floor (1.26.5): govulncheck reports
          # reachable standard-library vulnerabilities in net/http, crypto/tls,
          # crypto/x509 and others for every release below 1.26.11, so the
          # govulncheck step below cannot pass on 1.26.5. go.mod's `go 1.26.5`
          # is a minimum and stays as is.
          go-version: "1.26.11"
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Build (every module standalone, GOWORK=off)
        run: scripts/for-each-module.sh go build ./...

      - name: Vet
        run: scripts/for-each-module.sh go vet ./...

      - name: Link graph (each binary links only the modules it uses)
        run: make check-link-graph

      - name: Module graph (which modules may depend on which)
        run: make check-module-graph

      - name: Dockerfile COPY lists match each module's dependencies
        run: make check-dockerfile-modules

      - name: Module hygiene (go mod tidy no-op, replace targets, no version skew)
        run: make check-module-hygiene

      - name: Dev defaults and container policy (placeholder keys, seed guard, non-root, localhost ports)
        run: make check-dev-defaults

      - name: HTTP hardening (server timeouts, body cap, trusted proxies)
        run: make check-http-hardening

      - name: Pending E2E specs (no spec E1 to E14 is skipped past its phase)
        run: make check-pending-e2e

      - name: Guards fail on injected violations
        run: make test-guards

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-only: true

      - name: golangci-lint in every module (boundaries inside services/course, RFC §4.4)
        run: scripts/for-each-module.sh golangci-lint run ./...

      - name: Install govulncheck (pinned)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # govulncheck exits non-zero only for vulnerabilities whose vulnerable
      # symbol is actually called from the module's code; findings in packages
      # that are imported but not called, or in required modules that are not
      # even imported, are printed but do not fail the job. The vulnerability
      # database is live, so a new advisory can fail an unrelated PR: bump the
      # dependency (or the Go version above) rather than skipping the step.
      - name: govulncheck in every module (fails on reachable vulnerabilities only)
        run: scripts/for-each-module.sh govulncheck ./...

      # Same order as `make migrate-up` and libs/testenv (docs/plans/microservices-split.md
      # section 3.1): platform identity course analytics notification cutover.
      - name: Run migrations (all six sets, in order)
        run: |
          for svc in platform identity course analytics notification cutover; do
            go run -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest \
              -path migrations/$svc \
              -database "postgres://smartcourse:smartcourse@localhost:5432/smartcourse?sslmode=disable&x-migrations-table=${svc}_schema_migrations" \
              up
          done

      # The runner's psql (15+) is needed for the script's \getenv. [DEV ONLY] passwords.
      - name: Per-service Postgres roles (scripts/db-roles.sh)
        run: scripts/db-roles.sh
        env:
          DB_OWNER_DSN: postgres://smartcourse:smartcourse@localhost:5432/smartcourse?sslmode=disable
          SVC_IDENTITY_PASSWORD: svc_identity_dev
          SVC_COURSE_PASSWORD: svc_course_dev
          SVC_ANALYTICS_PASSWORD: svc_analytics_dev
          SVC_NOTIFICATION_PASSWORD: svc_notification_dev

      - name: Unit + integration tests (race detector always on — RFC §10.6/§18.7)
        run: scripts/for-each-module.sh go test -race -tags=integration ./...
        env:
          POSTGRES_DSN: postgres://smartcourse:smartcourse@localhost:5432/smartcourse?sslmode=disable
          REDIS_ADDR: localhost:6379

      - name: Coverage report
        run: scripts/for-each-module.sh sh -c 'go test -race -tags=integration -coverprofile=coverage.out ./... && go tool cover -func=coverage.out | tail -1'
        env:
          POSTGRES_DSN: postgres://smartcourse:smartcourse@localhost:5432/smartcourse?sslmode=disable
          REDIS_ADDR: localhost:6379

  # Every image builds, without pushing: one Dockerfile per binary (identity-api,
  # identity-worker, course-api, course-worker, analytics-api, analytics-worker,
  # notification-worker, publishing-worker, audit-api, audit-worker) plus
  # schema-init, the one-shot Schema Registry bootstrap. The build context is
  # the repo root and each image compiles its own module with GOWORK=off, so a
  # missing COPY or replace fails here. The first step fails when a Dockerfile.*
  # exists that the matrix does not list (or the other way round), so a new
  # binary cannot skip this job. Also validates the compose file for every profile.
  docker-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
          - identity-api
          - identity-worker
          - course-api
          - course-worker
          - analytics-api
          - analytics-worker
          - notification-worker
          - publishing-worker
          - audit-api
          - audit-worker
          - schema-init
    steps:
      - uses: actions/checkout@v4

      - name: Matrix lists every Dockerfile
        run: |
          want=$(ls Dockerfile.* | sed 's/^Dockerfile\.//' | sort)
          have=$(printf '%s\n' identity-api identity-worker course-api course-worker analytics-api analytics-worker notification-worker publishing-worker audit-api audit-worker schema-init | sort)
          if [ "$want" != "$have" ]; then
            echo "Dockerfile.* and the matrix differ:"; diff <(echo "$want") <(echo "$have") || true
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }} (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.image }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker compose config for every profile
        run: |
          docker compose config -q
          for p in core workflow observability full; do
            docker compose --profile "$p" config -q
          done

  # The container tier of the Week 3 end-to-end scenarios (test/e2e/harness,
  # build tag `e2e`): real Postgres, Redis, Kafka, Schema Registry, MongoDB,
  # Mailpit and Temporal in Docker, and the ten long-running service binaries run as
  # subprocesses built by the harness (testcontainers for the infrastructure). Separate from
  # build-lint-test on purpose: it takes many minutes and a dozen containers,
  # and runs in parallel with it. Only tests carrying the `e2e` tag run here
  # (the main job's -tags=integration never selects them).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: End-to-end scenarios (make test-e2e)
        run: make test-e2e
