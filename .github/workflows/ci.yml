name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smartcourse
          POSTGRES_PASSWORD: smartcourse
          POSTGRES_DB: smartcourse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smartcourse -d smartcourse"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: golangci-lint (module boundaries, RFC §4.4)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      - name: Run migrations
        run: |
          go run -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest \
            -path migrations \
            -database "postgres://smartcourse:smartcourse@localhost:5432/smartcourse?sslmode=disable" \
            up

      - name: Unit + integration tests (race detector always on — RFC §10.6/§18.7)
        run: go test -race ./...
        env:
          POSTGRES_DSN: postgres://smartcourse:smartcourse@localhost:5432/smartcourse?sslmode=disable
          REDIS_ADDR: localhost:6379

      - name: Coverage report
        run: go test -race -coverprofile=coverage.out ./... && go tool cover -func=coverage.out
        env:
          POSTGRES_DSN: postgres://smartcourse:smartcourse@localhost:5432/smartcourse?sslmode=disable
          REDIS_ADDR: localhost:6379
