# Alert rules (RFC §12.3, §6.9). EVERY threshold below is a PLACEHOLDER
# (a local-dev starting point, not a tuned SLO): no traffic data exists to tune
# them against, and the RFC §13.1 latency targets are not wired to a rule.
# Each rule says why its number is a placeholder. Review with the service
# owners before any real deployment.
# No Alertmanager is wired: alerts are visible at http://localhost:9090/alerts.
#
# Series come from ten binaries (prometheus/prometheus.yml). Every target has
# labels `service` (identity, course, analytics, notification, publishing,
# audit) and `binary`; rules group by those, never by a hard-coded job list.
#
#   http_*                                       the four APIs (identity, course, analytics, audit)
#   db_connections_*                             every binary with Postgres (not publishing, audit)
#   outbox_*                                     identity and course (api and worker both
#                                                report their own service's outbox)
#   kafka_consumer_lag, event_processed_total,   the workers' consumers (per consumer group)
#   dead_letter_total
#   asynq_*                                      the workers that run Asynq pools
#   workflow_*                                   the Temporal workers (publishing-worker,
#                                                course-worker: activities)
#
# Each service owns its own outbox now (identity.outbox, course.outbox), so the
# outbox rules group by `service`; within one service the api and the worker
# read the same table, hence max() inside the group.
groups:
  - name: smartcourse-async-health
    rules:
      # RFC §6.9: alert on the RATE of dead-lettering, not its existence.
      # PLACEHOLDER 0.05/s: no real dead-letter rate has been observed, and the
      # series stays empty until the Kafka transport parks events.
      - alert: DeadLetterRateHigh
        expr: sum by (service, consumer) (rate(dead_letter_total[10m])) > 0.05
        for: 10m
        labels: {severity: page}
        annotations:
          summary: "Sustained dead-lettering by {{ $labels.consumer }} ({{ $labels.service }})"
          description: "More than 0.05 dead letters/s (~3/min) for 10m. An occasional poison message is expected; a sustained rate is an incident."

      # A consumer holds a record when the dead-letter sink (MongoDB) refuses it:
      # the offset does not advance and the partition stalls, but nothing is lost
      # (ADR-0030, libs/eventbus). There is deliberately no time limit after
      # which the record is skipped, so this alert is how the stall is noticed.
      # PLACEHOLDER 5m: a short MongoDB blip should not page; a stall this long
      # is delaying events behind the held record.
      - alert: DeadLetterRecordHeld
        expr: max by (service, consumer) (dead_letter_held_records) > 0
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.consumer }} ({{ $labels.service }}) is holding a record the dead-letter store refused"
          description: "A partition has been stalled for over 5m because the dead-letter sink (MongoDB) refuses writes. No event is lost; the backlog drains when the sink recovers. Check MongoDB."

      # PLACEHOLDER 300s: the relay polls about once a second, so a real
      # healthy age is seconds; 5 minutes is a guess at "clearly stuck". A row
      # the relay gave up on (last_error set) stays unpublished and keeps this
      # firing until it is dealt with, by design.
      - alert: OutboxOldestUnpublishedTooOld
        expr: max by (service) (outbox_oldest_unpublished_seconds) > 300
        for: 2m
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.service }} outbox has an event unpublished for over 5 minutes"
          description: "The service worker relay is failing or Kafka is unreachable; backlog size can hide a single stuck row, age cannot."

      - alert: OutboxBacklogGrowing
        # PLACEHOLDER 100 rows: no sizing data; depends on write rate.
        expr: max by (service) (outbox_backlog) > 100 and deriv(max by (service) (outbox_backlog)[10m:1m]) > 0
        for: 10m
        labels: {severity: warn}
        annotations:
          summary: "{{ $labels.service }} outbox_backlog is {{ $value }} and still rising"

      # PLACEHOLDER 1000 messages. Lag is per consumer group (group id = consumer
      # name) and topic, from the worker that owns the group.
      - alert: KafkaConsumerLagGrowing
        expr: max by (service, group, topic) (kafka_consumer_lag) > 1000 and deriv(max by (service, group, topic) (kafka_consumer_lag)[10m:1m]) > 0
        for: 10m
        labels: {severity: warn}
        annotations:
          summary: "Consumer group {{ $labels.group }} ({{ $labels.service }}) is falling behind on {{ $labels.topic }}"

      # asynq_retry_count is treated as a gauge (tasks currently awaiting
      # retry); growth over 15m means jobs fail faster than they recover.
      # PLACEHOLDER +10 in 15m: jobs are few (maintenance schedules, mail), so
      # any sustained retry growth is notable, but 10 is a guess.
      - alert: AsynqRetryGrowth
        expr: sum by (service, queue) (delta(asynq_retry_count[15m])) > 10
        for: 5m
        labels: {severity: warn}
        annotations:
          summary: "Asynq retry set growing on queue {{ $labels.queue }} ({{ $labels.service }})"
          description: "Provider trouble surfaces here first (RFC §12.3)."

      # Not a tuned number: any failure is reported. workflow_* counts runs
      # first executed live on a worker process (replays are not counted).
      - alert: WorkflowFailures
        expr: sum by (service) (increase(workflow_failed_total[15m])) > 0
        labels: {severity: warn}
        annotations:
          summary: "Publish workflow failures in the last 15m ({{ $labels.service }})"

  - name: smartcourse-http-and-db
    rules:
      # PLACEHOLDER 5%: no error budget has been agreed.
      - alert: High5xxRatio
        expr: |
          sum by (service, binary) (rate(http_requests_total{status=~"5.."}[5m]))
            / sum by (service, binary) (rate(http_requests_total[5m])) > 0.05
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "More than 5% of requests to {{ $labels.binary }} return 5xx"

      # PLACEHOLDER 90%: pool sizes come from POSTGRES_MAX_OPEN_CONNS (RFC 13.2).
      # db_connections_max is 0 for an unlimited pool, which divides to +Inf, so
      # that case is excluded.
      - alert: DBConnectionPoolNearlyExhausted
        expr: db_connections_in_use / (db_connections_max > 0) > 0.9
        for: 5m
        labels: {severity: warn}
        annotations:
          summary: "DB pool above 90% on {{ $labels.binary }}"

  - name: smartcourse-scrape-health
    rules:
      # Not a tuned number. Any of the ten binaries' internal listeners that
      # cannot be scraped. The `binary` label selects the ten application
      # targets (Prometheus's own job has none). publishing-worker only runs
      # under the `workflow` profile; where it is not started this rule fires
      # for it, because the target is configured.
      - alert: ScrapeTargetDown
        expr: up{binary!=""} == 0
        for: 2m
        labels: {severity: page}
        annotations:
          summary: "Prometheus cannot scrape {{ $labels.binary }} ({{ $labels.service }})"
