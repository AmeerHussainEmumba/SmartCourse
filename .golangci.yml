# Module-boundary enforcement (RFC §4.4, ADR-0001, ADR-0026).
#
# Boundaries between SERVICES are enforced by Go modules, not by this file: a
# service can't import another service's code without adding that module to
# its go.mod, and scripts/check-module-graph.sh (run by `make
# check-module-graph` and CI) fails if it does. Libraries (libs/*) likewise
# can't import any service.
#
# What's left for depguard is the boundary INSIDE one module: services/course
# holds course, enrollment, progress and workflows together (ADR-0012 needs
# them in one process), so Go can't separate them. No package there imports
# another's repository, domain, or GORM models. Cross-package reads go through
# a consumer-declared interface; cross-package writes go through events. A
# violation here fails the build, not review vigilance.
#
# Run per module (scripts/for-each-module.sh golangci-lint run ./...).

version: "2"

linters:
  enable:
    - depguard
    - errcheck
    - govet
    - staticcheck
    - unused
  settings:
    depguard:
      rules:
        course:
          files: ["**/services/course/course/**"]
          deny:
            - pkg: github.com/AmeerHussainEmumba/SmartCourse/services/course/enrollment
              desc: "course must not import enrollment directly (RFC §4.4) — declare a consumer-side interface"
            - pkg: github.com/AmeerHussainEmumba/SmartCourse/services/course/progress
              desc: "course must not import progress directly (RFC §4.4) — declare a consumer-side interface"
            - pkg: github.com/AmeerHussainEmumba/SmartCourse/services/course/workflows
              desc: "course must not import workflows (the dependency runs one way: workflows imports course) — start the workflow by course.PublishWorkflowName"
        enrollment:
          files: ["**/services/course/enrollment/**"]
          deny:
            - pkg: github.com/AmeerHussainEmumba/SmartCourse/services/course/course
              desc: "enrollment must not import course's repository/domain directly — declare a CourseReader-style interface (RFC §4.4 example)"
            - pkg: github.com/AmeerHussainEmumba/SmartCourse/services/course/progress
              desc: "enrollment must not import progress directly (RFC §4.4) — declare a consumer-side interface"
            - pkg: github.com/AmeerHussainEmumba/SmartCourse/services/course/workflows
              desc: "enrollment must not import workflows"
        progress:
          files: ["**/services/course/progress/**"]
          deny:
            - pkg: github.com/AmeerHussainEmumba/SmartCourse/services/course/course
              desc: "progress must not import course directly (RFC §4.4) — declare a consumer-side interface"
            - pkg: github.com/AmeerHussainEmumba/SmartCourse/services/course/enrollment
              desc: "progress must not import enrollment directly (RFC §4.4) — declare a consumer-side interface"
            - pkg: github.com/AmeerHussainEmumba/SmartCourse/services/course/workflows
              desc: "progress must not import workflows"
