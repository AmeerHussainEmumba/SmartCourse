name: smartcourse

# Compose profiles (ADR-0018): a contributor working on enrollment logic
# starts two containers, not a dozen. Every service lists every profile tier
# it belongs to; `make dev-core` starts only `core`, `make dev-full` starts
# everything. See README.md and docs/rfc/smartcourse-rfc.md §17.1.

x-profiles-core: &profiles-core [core, workflow, events, observability, full]
x-profiles-workflow: &profiles-workflow [workflow, events, observability, full]
x-profiles-events: &profiles-events [events, observability, full]
x-profiles-observability: &profiles-observability [observability, full]

services:
  postgres:
    image: postgres:16-alpine
    profiles: *profiles-core
    environment:
      POSTGRES_USER: smartcourse
      POSTGRES_PASSWORD: smartcourse
      POSTGRES_DB: smartcourse
    # Mapped off the Postgres default (5432) to avoid colliding with other
    # local projects' containers — the application always connects via
    # POSTGRES_DSN (env.example), so this is a host-side convenience only.
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcourse -d smartcourse"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: *profiles-core
    ports: ["127.0.0.1:6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    profiles: *profiles-core
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: smartcourse
      MINIO_ROOT_PASSWORD: smartcourse123
    ports:
      - "127.0.0.1:9002:9000" # S3 API
      - "127.0.0.1:9003:9001" # console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    profiles: *profiles-core
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 smartcourse smartcourse123 &&
      mc mb -p local/smartcourse-assets &&
      exit 0
      "

  # worker, identity-api, course-api, analytics-api (ADR-0022, ADR-0023):
  # the application itself, as four independently built/deployed services
  # sharing one PostgreSQL database and one set of Go packages — a
  # modular monolith's code (ADR-0001), four deployment artifacts.
  # Environment is set directly here, not via env_file: .env —
  # deliberately, so `docker compose up` works on a fresh clone before
  # anyone has copied env.example to .env, and because the in-network
  # values (service names, not localhost:<mapped-port>) are different from
  # what env.example gives a host-side `go run` anyway. Every value below
  # is a local-dev-only placeholder, same as postgres/minio's hardcoded
  # credentials above — never reuse JWT_SIGNING_KEY beyond local dev.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    profiles: *profiles-core
    environment:
      APP_ENV: development
      POSTGRES_DSN: postgres://smartcourse:smartcourse@postgres:5432/smartcourse?sslmode=disable
      # worker touches platform.outbox (reads), platform.processed_events
      # (writes, its own idempotency marker), course.enrollments (writes,
      # via enrollment.handleCourseArchived), and every analytics table
      # (writes, via analytics' event handlers) — not identity, since no
      # relay handler reads or writes identity.* (schema-per-service,
      # ADR-0024).
      POSTGRES_SEARCH_PATH: platform,course,analytics,public
      REDIS_ADDR: redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY_ID: smartcourse
      MINIO_SECRET_ACCESS_KEY: smartcourse123
      JWT_SIGNING_KEY: local-dev-only-signing-key-do-not-use-elsewhere-32b
      # Only read by this binary's Temporal worker (ADR-0009/0025) — not
      # identity-api/analytics-api. worker is tagged *profiles-core, same
      # as temporal itself is NOT (it's *profiles-workflow), so under
      # plain `core` this points at a server that isn't running; that's
      # fine (temporal.Connect is lazy) — only publishing itself
      # would fail until `make dev-workflow` brings temporal up too.
      TEMPORAL_HOST_PORT: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: course-publish
      # Relay pool and Asynq (RFC §10.2: one pool per queue, 10/5/3) and the
      # scheduled jobs (ADR-0013). The Postgres pool of 20 connections holds
      # 4 relay workers x 2 plus the default and low pools that touch it.
      RELAY_WORKERS: "4"
      # Event transport (ADR-0029). inprocess is the default and needs no Kafka.
      # To run the Kafka transport, start the `events` profile (kafka and
      # schema-registry), register the schemas (go run ./cmd/register-schemas in
      # libs/events), then set EVENT_TRANSPORT to kafka and uncomment the next two
      # lines. The worker fails at start if the registry or a subject is missing.
      EVENT_TRANSPORT: inprocess
      # KAFKA_BROKERS: kafka:9092
      # SCHEMA_REGISTRY_URL: http://schema-registry:8081
      ASYNQ_CRITICAL_CONCURRENCY: "10"
      ASYNQ_DEFAULT_CONCURRENCY: "5"
      ASYNQ_LOW_CONCURRENCY: "3"
      ASYNQ_MAX_RETRY: "5"
      ASYNQ_BACKOFF_BASE: 2s
      ASYNQ_BACKOFF_MAX: 10m
      ASYNQ_SHUTDOWN_TIMEOUT: 30s
      # Mail goes to the Mailpit sink in the same profile; no real provider.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      OUTBOX_RETENTION: 168h
      JOBS_RECONCILE_PUBLISHES_INTERVAL: 1m
      JOBS_ANALYTICS_RECONCILE_INTERVAL: 1m
      JOBS_ENROLLMENT_COUNT_INTERVAL: 1h
      JOBS_IDEMPOTENCY_PRUNE_INTERVAL: 1h
      JOBS_OUTBOX_PRUNE_INTERVAL: 1h
      # Admin surface (failed-event list and replay, health), admin JWT only
      # (ADR-0031). Published on the loopback interface only.
      ADMIN_HTTP_ADDR: ":8093"
      # MongoDB (compose `events` profile): the archive, dead letters and
      # replay. Optional: if it is not running the worker still starts, logs
      # the outage and retries, and the relay and analytics are unaffected.
      MONGO_URI: mongodb://mongodb:27017
    ports: ["127.0.0.1:8093:8093"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # identity-api (ADR-0023, extending ADR-0022): services/identity/identity's HTTP
  # surface split into its own deployable image — the most self-contained
  # module in the codebase (no other module reads its tables directly;
  # everyone else reads the caller's identity off the JWT claims instead).
  # Port 8090 — no collision with 8081 (schema-registry, events
  # profile), 8088 (temporal-ui), or 8089 (swagger-ui).
  identity-api:
    build:
      context: .
      dockerfile: Dockerfile.identity-api
    profiles: *profiles-core
    environment:
      APP_ENV: development
      HTTP_PORT: "8080"
      POSTGRES_DSN: postgres://smartcourse:smartcourse@postgres:5432/smartcourse?sslmode=disable
      # identity + platform (identity.Service writes its outbox events
      # into platform.outbox, in the same transaction as the business
      # write — ADR-0006) + public (citext).
      POSTGRES_SEARCH_PATH: identity,platform,public
      REDIS_ADDR: redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY_ID: smartcourse
      MINIO_SECRET_ACCESS_KEY: smartcourse123
      JWT_SIGNING_KEY: local-dev-only-signing-key-do-not-use-elsewhere-32b
    ports: ["127.0.0.1:8090:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # course-api (ADR-0023, extending ADR-0022): services/course/course,
  # services/course/enrollment, and services/course/progress's HTTP surface, kept
  # together in one image because enrollment locks the `courses` row in
  # the SAME transaction it writes an enrollment row in (ADR-0012's
  # seat-limit guarantee) — splitting them would force that lock into a
  # network call. Port 8091 — no collision with 8081
  # (schema-registry, events profile), 8088 (temporal-ui), or 8089
  # (swagger-ui).
  course-api:
    build:
      context: .
      dockerfile: Dockerfile.course-api
    profiles: *profiles-core
    environment:
      APP_ENV: development
      HTTP_PORT: "8080"
      POSTGRES_DSN: postgres://smartcourse:smartcourse@postgres:5432/smartcourse?sslmode=disable
      # course (course+enrollment+progress's shared schema, ADR-0024) +
      # platform (their outbox writes land in platform.outbox) + public
      # (citext, pg_trgm — course_search_index).
      POSTGRES_SEARCH_PATH: course,platform,public
      REDIS_ADDR: redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY_ID: smartcourse
      MINIO_SECRET_ACCESS_KEY: smartcourse123
      JWT_SIGNING_KEY: local-dev-only-signing-key-do-not-use-elsewhere-32b
      # Service.Publish starts the publish workflow here (ADR-0009/0025) —
      # see worker's identical block above for why this is safe to boot
      # with no Temporal present (plain `core` profile).
      TEMPORAL_HOST_PORT: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: course-publish
    ports: ["127.0.0.1:8091:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # analytics-api (ADR-0023, extending ADR-0022): services/analytics/analytics's HTTP
  # surface split into its own deployable image — read-only, already
  # decoupled (consumes other modules' state via the relay/outbox, never a
  # direct call into another module), the lowest-risk candidate to split
  # out of cmd/api first. Port 8092 — no collision with 8081
  # (schema-registry, events profile), 8088 (temporal-ui), or 8089
  # (swagger-ui).
  analytics-api:
    build:
      context: .
      dockerfile: Dockerfile.analytics-api
    profiles: *profiles-core
    environment:
      APP_ENV: development
      HTTP_PORT: "8080"
      POSTGRES_DSN: postgres://smartcourse:smartcourse@postgres:5432/smartcourse?sslmode=disable
      # analytics only — its HTTP handlers are read-only, GET-only, and
      # never write an outbox event, so unlike the other three it never
      # needs platform (ADR-0024: analytics-api doesn't produce events).
      POSTGRES_SEARCH_PATH: analytics,public
      REDIS_ADDR: redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY_ID: smartcourse
      MINIO_SECRET_ACCESS_KEY: smartcourse123
      JWT_SIGNING_KEY: local-dev-only-signing-key-do-not-use-elsewhere-32b
      # Failed Events metric (GET /analytics/issues) reads failed_events from
      # MongoDB (compose `events` profile). Optional: without it that one
      # route answers 503; every other route is unaffected.
      MONGO_URI: mongodb://mongodb:27017
    ports: ["127.0.0.1:8092:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Browsable, runnable view of api/openapi.yaml — a static UI container,
  # not a build step: it reads the file read-only, so it's always showing
  # what's actually committed, not a snapshot that can drift. Port 8089,
  # not 8080 (the API) or 8081 (schema-registry, events profile) — picked
  # specifically to not collide with either.
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.32.1
    profiles: *profiles-core
    environment:
      # Must match the volume mount target exactly — the image's own
      # entrypoint script does `[[ -f "$SWAGGER_JSON" ]]` to decide whether
      # to wire the spec in at all; a mismatch here fails that check
      # silently and the UI falls back to the default petstore example
      # with no error anywhere.
      SWAGGER_JSON: /openapi.yaml
    volumes:
      - ./api/openapi.yaml:/openapi.yaml:ro
    ports: ["127.0.0.1:8089:8080"]

  temporal:
    image: temporalio/auto-setup:latest
    profiles: *profiles-workflow
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: smartcourse
      POSTGRES_PWD: smartcourse
      POSTGRES_SEEDS: postgres
    ports: ["127.0.0.1:7233:7233"]
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:latest
    profiles: *profiles-workflow
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports: ["127.0.0.1:8088:8080"]
    depends_on: [temporal]

  kafka:
    image: apache/kafka:3.7.0
    profiles: *profiles-events
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports: ["127.0.0.1:29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # Topic provisioning as code (RFC §6.5): one topic per aggregate. One-shot
  # and idempotent (--if-not-exists), so `up` can be re-run safely. Uses the
  # CLI already inside the pinned kafka image. Partitions/replication come
  # from env with single-broker defaults; they only apply when a topic is
  # first created (Kafka never shrinks partitions, and --if-not-exists will
  # not change an existing topic) — use kafka-topics.sh --alter to grow one.
  kafka-init:
    image: apache/kafka:3.7.0
    profiles: *profiles-events
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    environment:
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      KAFKA_TOPIC_REPLICATION_FACTOR: ${KAFKA_TOPIC_REPLICATION_FACTOR:-1}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        for t in identity.events course.events enrollment.events progress.events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$t" --partitions "$$KAFKA_TOPIC_PARTITIONS" --replication-factor "$$KAFKA_TOPIC_REPLICATION_FACTOR"
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    profiles: *profiles-events
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports: ["127.0.0.1:8081:8081"]
    depends_on: [kafka]

  mongodb:
    image: mongo:7
    profiles: *profiles-events
    ports: ["127.0.0.1:27017:27017"]

  # Self-hosted SMTP sink with a web UI (Week 3 decision D6): the project
  # deliberately uses NO real mail provider. Apps send to mailpit:1025
  # in-network (SMTP_HOST/SMTP_PORT); read mail at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.34.0
    profiles: *profiles-core
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # web UI + HTTP API
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Config is repo-provisioned from ./observability (see observability/README.md).
  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: *profiles-observability
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:13.3.1
    profiles: *profiles-observability
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [prometheus]

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    profiles: *profiles-observability
    environment:
      COLLECTOR_OTLP_ENABLED: "true" # OTLP gRPC :4317, HTTP :4318
    ports:
      - "127.0.0.1:16686:16686" # UI
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP

volumes:
  pgdata:
  miniodata:
