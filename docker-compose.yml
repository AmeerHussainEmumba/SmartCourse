name: smartcourse

# Compose profiles (ADR-0018): a contributor working on enrollment logic
# starts two containers, not a dozen. Every service lists every profile tier
# it belongs to; `make dev-core` starts only `core`, `make dev-full` starts
# everything. See README.md and docs/rfc/smartcourse-rfc.md §17.1.

x-profiles-core: &profiles-core [core, workflow, events, observability, full]
x-profiles-workflow: &profiles-workflow [workflow, events, observability, full]
x-profiles-events: &profiles-events [events, observability, full]
x-profiles-observability: &profiles-observability [observability, full]

services:
  postgres:
    image: postgres:16-alpine
    profiles: *profiles-core
    environment:
      POSTGRES_USER: smartcourse
      POSTGRES_PASSWORD: smartcourse
      POSTGRES_DB: smartcourse
    # Mapped off the Postgres default (5432) to avoid colliding with other
    # local projects' containers — the application always connects via
    # POSTGRES_DSN (env.example), so this is a host-side convenience only.
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcourse -d smartcourse"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: *profiles-core
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    profiles: *profiles-core
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: smartcourse
      MINIO_ROOT_PASSWORD: smartcourse123
    ports:
      - "9002:9000" # S3 API
      - "9003:9001" # console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    profiles: *profiles-core
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 smartcourse smartcourse123 &&
      mc mb -p local/smartcourse-assets &&
      exit 0
      "

  # api and worker (ADR-0022): the application itself, as two independently
  # built/deployed services sharing one PostgreSQL database and one set of
  # Go packages — a modular monolith's code (ADR-0001), two deployment
  # artifacts. Environment is set directly here, not via env_file: .env —
  # deliberately, so `docker compose up` works on a fresh clone before
  # anyone has copied env.example to .env, and because the in-network
  # values (service names, not localhost:<mapped-port>) are different from
  # what env.example gives a host-side `go run` anyway. Every value below
  # is a local-dev-only placeholder, same as postgres/minio's hardcoded
  # credentials above — never reuse JWT_SIGNING_KEY beyond local dev.
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    profiles: *profiles-core
    environment:
      APP_ENV: development
      HTTP_PORT: "8080"
      POSTGRES_DSN: postgres://smartcourse:smartcourse@postgres:5432/smartcourse?sslmode=disable
      REDIS_ADDR: redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY_ID: smartcourse
      MINIO_SECRET_ACCESS_KEY: smartcourse123
      JWT_SIGNING_KEY: local-dev-only-signing-key-do-not-use-elsewhere-32b
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    profiles: *profiles-core
    environment:
      APP_ENV: development
      POSTGRES_DSN: postgres://smartcourse:smartcourse@postgres:5432/smartcourse?sslmode=disable
      REDIS_ADDR: redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY_ID: smartcourse
      MINIO_SECRET_ACCESS_KEY: smartcourse123
      JWT_SIGNING_KEY: local-dev-only-signing-key-do-not-use-elsewhere-32b
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # identity-api (ADR-0023, extending ADR-0022): internal/identity's HTTP
  # surface split into its own deployable image — the most self-contained
  # module in the codebase (no other module reads its tables directly;
  # everyone else reads the caller's identity off the JWT claims instead).
  # Port 8090, picked to not collide with 8080 (api, being phased out),
  # 8081 (schema-registry, events profile), 8088 (temporal-ui), or 8089
  # (swagger-ui).
  identity-api:
    build:
      context: .
      dockerfile: Dockerfile.identity-api
    profiles: *profiles-core
    environment:
      APP_ENV: development
      HTTP_PORT: "8080"
      POSTGRES_DSN: postgres://smartcourse:smartcourse@postgres:5432/smartcourse?sslmode=disable
      REDIS_ADDR: redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY_ID: smartcourse
      MINIO_SECRET_ACCESS_KEY: smartcourse123
      JWT_SIGNING_KEY: local-dev-only-signing-key-do-not-use-elsewhere-32b
    ports: ["8090:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # course-api (ADR-0023, extending ADR-0022): internal/course,
  # internal/enrollment, and internal/progress's HTTP surface, kept
  # together in one image because enrollment locks the `courses` row in
  # the SAME transaction it writes an enrollment row in (ADR-0012's
  # seat-limit guarantee) — splitting them would force that lock into a
  # network call. Port 8091, picked to not collide with 8080 (api, being
  # phased out), 8081 (schema-registry, events profile), 8088
  # (temporal-ui), or 8089 (swagger-ui).
  course-api:
    build:
      context: .
      dockerfile: Dockerfile.course-api
    profiles: *profiles-core
    environment:
      APP_ENV: development
      HTTP_PORT: "8080"
      POSTGRES_DSN: postgres://smartcourse:smartcourse@postgres:5432/smartcourse?sslmode=disable
      REDIS_ADDR: redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY_ID: smartcourse
      MINIO_SECRET_ACCESS_KEY: smartcourse123
      JWT_SIGNING_KEY: local-dev-only-signing-key-do-not-use-elsewhere-32b
    ports: ["8091:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # analytics-api (ADR-0023, extending ADR-0022): internal/analytics's HTTP
  # surface split into its own deployable image — read-only, already
  # decoupled (consumes other modules' state via the relay/outbox, never a
  # direct call into another module), the lowest-risk candidate to split
  # out of cmd/api first. Port 8092, picked to not collide with 8080
  # (api, being phased out), 8081 (schema-registry, events profile), 8088
  # (temporal-ui), or 8089 (swagger-ui).
  analytics-api:
    build:
      context: .
      dockerfile: Dockerfile.analytics-api
    profiles: *profiles-core
    environment:
      APP_ENV: development
      HTTP_PORT: "8080"
      POSTGRES_DSN: postgres://smartcourse:smartcourse@postgres:5432/smartcourse?sslmode=disable
      REDIS_ADDR: redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY_ID: smartcourse
      MINIO_SECRET_ACCESS_KEY: smartcourse123
      JWT_SIGNING_KEY: local-dev-only-signing-key-do-not-use-elsewhere-32b
    ports: ["8092:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Browsable, runnable view of api/openapi.yaml — a static UI container,
  # not a build step: it reads the file read-only, so it's always showing
  # what's actually committed, not a snapshot that can drift. Port 8089,
  # not 8080 (the API) or 8081 (schema-registry, events profile) — picked
  # specifically to not collide with either.
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.32.1
    profiles: *profiles-core
    environment:
      # Must match the volume mount target exactly — the image's own
      # entrypoint script does `[[ -f "$SWAGGER_JSON" ]]` to decide whether
      # to wire the spec in at all; a mismatch here fails that check
      # silently and the UI falls back to the default petstore example
      # with no error anywhere.
      SWAGGER_JSON: /openapi.yaml
    volumes:
      - ./api/openapi.yaml:/openapi.yaml:ro
    ports: ["8089:8080"]

  temporal:
    image: temporalio/auto-setup:latest
    profiles: *profiles-workflow
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: smartcourse
      POSTGRES_PWD: smartcourse
      POSTGRES_SEEDS: postgres
    ports: ["7233:7233"]
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:latest
    profiles: *profiles-workflow
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports: ["8088:8080"]
    depends_on: [temporal]

  kafka:
    image: apache/kafka:3.7.0
    profiles: *profiles-events
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports: ["29092:29092"]

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    profiles: *profiles-events
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports: ["8081:8081"]
    depends_on: [kafka]

  mongodb:
    image: mongo:7
    profiles: *profiles-events
    ports: ["27017:27017"]

  prometheus:
    image: prom/prometheus:latest
    profiles: *profiles-observability
    volumes:
      - ./deploy/prometheus:/etc/prometheus
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    profiles: *profiles-observability
    volumes:
      - ./deploy/grafana:/etc/grafana/provisioning
    ports: ["3001:3000"]

  jaeger:
    image: jaegertracing/all-in-one:latest
    profiles: *profiles-observability
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

volumes:
  pgdata:
  miniodata:
