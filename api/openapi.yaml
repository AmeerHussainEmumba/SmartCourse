openapi: 3.0.3
info:
  title: SmartCourse API
  version: "0.1.0"
  description: >
    Course delivery platform backend. This file is the contract (RFC §15.1)
    and is grown module by module as they're implemented — see
    docs/rfc/smartcourse-rfc.md §15 for conventions (keyset pagination,
    error shape, Idempotency-Key) and docs/rfc/smartcourse-prd.md for
    product context. Publishing workflow status (M2, ADR-0025) is built —
    see POST/GET on /courses/{id}/publish[-status] and GET /courses/search
    below. 8 of FR-5's 9 analytics metrics are live (DR-021; the ninth, failed events / workflow issues, has an admin route that answers 503 until a source is attached) — see /analytics/*
    below (DR-017: the last two of these had been computed since ADR-0024
    but had no read path until this spec caught up to reality). Endpoints
    not yet built (certificates, "Most Popular Courses"/"Failed Events"
    analytics, admin/audit beyond role change) are not listed here — an
    absent path means "not built yet," not "undocumented."

    Cross-cutting behaviour (all services). Request bodies are capped at
    1 MiB by default (413 PAYLOAD_TOO_LARGE; MAX_BODY_BYTES). Every response
    carries security headers (X-Content-Type-Options: nosniff,
    X-Frame-Options: DENY, Referrer-Policy: no-referrer, a restrictive
    Content-Security-Policy, Cache-Control: no-store; HSTS only over TLS or
    when HSTS_ENABLED=true). A client X-Request-Id is honoured only if it is
    1-64 characters of [A-Za-z0-9._-]; otherwise one is generated. A caller
    who does not own a course, module or lesson gets 404, never 403, so
    existence is not leaked. Instructor write routes check the caller's
    token version, so a demoted or suspended user's old access token is
    refused (token_stale), and the check fails closed with 503 if Redis is
    unreachable. Text fields reject NUL characters (400 validation_failed).
    The unauthenticated identity routes (register, refresh, logout, password
    reset and email verification) are rate limited per IP, and the routes
    that send email also per address (429; going over the per-address budget
    is silent so it cannot be used to probe addresses).
    GET /health/ready reports per-dependency "ok"/"failed" only; the detail
    goes to the service log, not the response.
servers:
  # One spec, three backing processes (ADR-0023) — route paths and
  # shapes didn't change, only which service answers them. Pick the
  # entry matching the endpoint you're trying; Swagger UI's "Execute"
  # fires against whichever is selected here.
  - url: http://localhost:8090/api/v1
    description: Local dev — identity-api (make run-identity-api) — auth, users, roles
  - url: http://localhost:8091/api/v1
    description: Local dev — course-api (make run-course-api) — courses, enrollments, progress
  - url: http://localhost:8092/api/v1
    description: Local dev — analytics-api (make run-analytics-api) — analytics dashboard
  - url: /api/v1
    description: Relative — correct once this spec is served from the same origin as the API itself (not the case for any local dev tool today)

paths:
  /auth/register:
    post:
      summary: >
        Register a new student account. Answers 202 with the same body
        whether or not the email already exists, so the endpoint cannot be
        used to find out which emails are registered (F-32). A new address
        gets a verification email; an existing one gets a password-reset
        email. No tokens are returned: call /auth/login afterwards (login
        does not require a verified email). Previously 201 with an
        AuthResponse, and 409 email_taken for an existing address.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { type: object, properties: { message: { type: string } } } } } }
        '429': { description: Too many requests from this IP, or too many emails to this address, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /auth/login:
    post:
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '401': { description: "Invalid credentials. A suspended or deleted account answers exactly like a wrong password, so the status cannot be used to confirm a password (F-32).", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: "Too many failed attempts: 5 per minute per account+IP, 20 per minute per account across all IPs. Only failures count.", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /auth/refresh:
    post:
      summary: Rotate a refresh token for a new access token (ADR-0015)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [refresh_token], properties: { refresh_token: { type: string } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '401': { description: Invalid, expired, or reused token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /auth/logout:
    post:
      summary: Revoke a refresh token (idempotent)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [refresh_token], properties: { refresh_token: { type: string } } } } }
      responses:
        '204': { description: No Content }

  /auth/password-reset/request:
    post:
      summary: Request a password reset email (DR-008)
      description: Always returns 202, whether or not the email exists (RFC §11.3 — no enumeration).
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email } } } } }
      responses:
        '202': { description: Accepted }

  /auth/password-reset/confirm:
    post:
      summary: Confirm a password reset. Revokes all refresh tokens and bumps token_version on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties: { token: { type: string }, new_password: { type: string, minLength: 8 } }
      responses:
        '204': { description: No Content }
        '401': { description: Invalid or expired token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /auth/verify-email/resend:
    post:
      summary: Resend the email verification link (DR-008)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email } } } } }
      responses:
        '202': { description: Accepted }

  /auth/verify-email/confirm:
    get:
      summary: Confirm email verification
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        '204': { description: No Content }
        '401': { description: Invalid or expired token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /me:
    get:
      summary: Get the current user's profile
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
    patch:
      summary: Update the current user's profile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [full_name], properties: { full_name: { type: string } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }

  /admin/users/{id}/role:
    patch:
      summary: Change a user's role/status (admin only; ADR-0015 addendum applies)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, status]
              properties:
                role: { type: string, enum: [student, instructor, admin] }
                status: { type: string, enum: [active, suspended, deleted] }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { description: "Token stale — token_version mismatch (ADR-0015 addendum)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Not an admin, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: "Unknown user id. Nothing is written (no cache key, no outbox event).", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: "last_admin: the change would leave the platform with no active admin", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /courses:
    get:
      summary: Catalogue — published courses, keyset-paginated (RFC §13.2), filterable
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: cursor, in: query, schema: { type: string }, description: Opaque cursor from a previous response's next_cursor }
        - { name: category, in: query, schema: { type: string }, description: Exact match against the course's category }
        - { name: level, in: query, schema: { type: string, enum: [beginner, intermediate, advanced] } }
        - { name: q, in: query, schema: { type: string }, description: Case-insensitive substring match against the course title }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogueResponse' } } } }
    post:
      parameters:
      - { $ref: '#/components/parameters/IdempotencyKey' }
      summary: Create a course (instructor only) — also creates its initial draft version
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateCourseRequest' } } }
      responses:
        '201': { description: Created }
        '409': { description: Slug already in use, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /courses/{slug}:
    get:
      summary: Published course detail — version, modules, lessons
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CourseDetail' } } } }
        '404': { description: Not found or not published, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /courses/{id}:
    patch:
      summary: Update the draft version (instructor, owner only)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateDraftRequest' } } }
      responses:
        '200': { description: OK }
        '404': { description: "Course not found, or not owned by the caller (a non-owner gets the same 404 as an unknown id so existence is not leaked; ADR-0026 phase 5, F-36)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /courses/{id}/modules:
    post:
      summary: Add a module to the draft (instructor, owner only)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, position]
              properties: { title: { type: string }, position: { type: integer, minimum: 1 } }
      responses:
        '201': { description: Created }

  /modules/{id}/lessons:
    post:
      summary: Add a lesson to a module in the draft (instructor, owner only)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateLessonRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Lesson' } } } }

  /modules/{id}:
    patch:
      summary: Update a module's title (instructor, owner only). Draft-only — rejected if the module belongs to a non-draft version (ADR-0010).
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateModuleRequest' } } }
      responses:
        '200': { description: OK }
        '409': { description: No draft, or module isn't on the draft version, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      summary: Delete a module (instructor, owner only)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: No Content } }

  /lessons/{id}:
    patch:
      summary: >
        Update a lesson (instructor, owner only). Draft-only, same rule
        as modules. content is the one optional field: omitted (or sent
        as JSON null) leaves the lesson's stored content untouched;
        anything else, including {}, replaces it.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateLessonRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Lesson' } } } }
        '409': { description: No draft, or lesson isn't on the draft version, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      summary: Delete a lesson (instructor, owner only)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: No Content } }

  /assets/upload-url:
    post:
      parameters:
      - { $ref: '#/components/parameters/IdempotencyKey' }
      summary: >
        Get a pre-signed URL to upload a learning asset straight to object
        storage (instructor who owns the course only; RFC §7.4, §11.7,
        ADR-0019). The API never proxies the bytes. The object key is generated
        by the server from the course (and optional lesson) and a fresh id; the
        client cannot choose or influence it. Send the returned headers verbatim
        and a body of exactly size_bytes bytes with a PUT to upload_url before
        expires_at (15 minutes): the content type and length are part of the
        signature, so storage rejects anything else. Then pass asset_key as the
        lesson's asset_key. The publish workflow's VerifyAssets checks that every
        referenced key exists in storage with an allowed type and size; a missing
        or invalid asset fails the publish (publish_failed, with a readable
        publish_error) without touching the live version. Allowed content types
        and per-type maximum sizes: video/mp4 and video/webm 2 GiB,
        application/pdf 100 MiB, image/png and image/jpeg 10 MiB. Admins and
        students are refused (403); an instructor who does not own the course
        gets 404.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UploadURLRequest' } } }
      responses:
        '200': { description: Pre-signed upload, content: { application/json: { schema: { $ref: '#/components/schemas/UploadURL' } } } }
        '400': { description: "validation_failed (bad ids, non-positive size) | unsupported_content_type", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Missing, invalid or stale token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Caller is not an instructor (student or admin), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: "Course not found, not owned by the caller, or lesson_id is not a lesson of the course's draft", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: "The course is archived (course_archived) or has no draft (no_draft)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { description: "asset_too_large: size_bytes exceeds the maximum for the content type", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: "assets_unavailable (object storage not configured) or temporarily_unavailable (signing failed)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /courses/{id}/publish:
    post:
      summary: >
        Start publishing the draft (instructor, owner only). Async as of M2
        (ADR-0025): starts services/course/workflows.PublishCourseWorkflow and
        returns immediately. The draft is claimed (state publishing) before
        the workflow starts, so a duplicate call while a publish is running
        gets 409 publish_in_progress instead of attaching to it (ADR-0028).
        If the workflow cannot be started (503) the claim is released and the
        call can simply be retried. Poll GET /courses/{id}/publish-status for
        the result.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '202': { description: Publish workflow started, content: { application/json: { schema: { $ref: '#/components/schemas/PublishAccepted' } } } }
        '404': { description: "Course not found, or not owned by the caller", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: "No draft to publish (no_draft), the course is archived (course_archived), or a publish is already running for it (publish_in_progress)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /courses/{id}/publish-status:
    get:
      summary: >
        Poll the publish workflow started by POST .../publish (instructor,
        owner only; RFC §7.5, ADR-0025). Reads course_versions directly,
        not Temporal's API — state is one of draft/publishing/ready/
        publish_failed/superseded; error is set only when state is
        publish_failed.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PublishStatus' } } } }
        '404': { description: "Course has never had a draft or a published version, or is not owned by the caller (same 404 either way)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /courses/search:
    get:
      summary: >
        Full-text ranked search over published courses (RFC §7.4's
        IndexSearch, pulled forward from M3 per ADR-0025) — distinct from
        GET /courses' plain substring filter (q param there). Indexed on
        every publish; not reconciled on a schedule yet.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/SearchResult' } } } } } } }

  /courses/{id}/archive:
    post:
      summary: >
        Archive a course (instructor, owner only) — soft delete via
        archived_at, not a row removal. Hides it from the catalogue and
        from GetPublishedDetail, blocks new enrollment, and withdraws
        every currently-active enrollment on it (services/course/enrollment's
        relay handler reacts to the course.course_archived event this
        writes). No "unarchive" exists.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: No Content }
        '404': { description: "Course not found, or not owned by the caller (a non-owner gets the same 404 as an unknown id so existence is not leaked; ADR-0026 phase 5, F-36)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /analytics/platform:
    get:
      summary: >
        Platform-wide totals (SmartCourse.md FR-5) — total students/instructors/courses published, average courses per student.
        Aggregate numbers only (no per-person data): any authenticated user may read them.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PlatformSnapshot' } } } }

  /analytics/popular-courses:
    get:
      summary: >
        Most Popular Courses (FR-5): published courses ranked by enrollments (active plus completed),
        highest first, courses with no enrollments omitted. Served from a Redis sorted set refreshed by
        the reconciler (about every 60 s) and falls back to Postgres if Redis is empty or unavailable;
        never a 5xx on a Redis miss. Ids and counts only, so any authenticated user may read it.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties: { course_id: { type: string, format: uuid }, enrollments: { type: integer, format: int64 } }
        '400': { description: "limit is not an integer from 1 to 50", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /analytics/issues:
    get:
      summary: >
        Failed Events / Workflow Issues (FR-5), admin only. Dead-letter backlog and failed-workflow counts.
        Answers 503 until a dead-letter source is attached to analytics-api (not wired yet).
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  failed_events:
                    type: object
                    properties:
                      total: { type: integer, format: int64 }
                      unresolved: { type: integer, format: int64 }
                      by_event_type: { type: object, additionalProperties: { type: integer, format: int64 } }
                  workflow_issues:
                    type: object
                    properties:
                      failed: { type: integer, format: int64 }
                      by_workflow: { type: object, additionalProperties: { type: integer, format: int64 } }
        '403': { description: "Caller is not an admin", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: "No failed-events or workflow source is attached", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /analytics/courses/{id}:
    get:
      summary: >
        One course's aggregate stats (FR-5: completion rate, average time
        to complete) — zeros if the course has never been published, not a
        404 (this schema never queries services/course/course directly, ADR-0024,
        so it can't distinguish "never published" from "doesn't exist").
        Access: admins may read any course; an instructor only a course they
        own; a student only if they have an active or completed enrollment in it
        (from analytics' own enrollment mirror). Everyone else gets 404, not
        403, so a course's existence is not leaked. Instructors are limited to
        courses they own (instructor_id from the course_published event); a
        course published before analytics recorded owners is readable by admins
        only until it is published again.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CourseStats' } } } }
        '404': { description: "Caller is a student without an active or completed enrollment in the course, or an instructor who does not own it", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /analytics/courses/{id}/daily-enrollments:
    get:
      summary: >
        One course's daily enrollment counts (FR-5 — "New Enrollments Over Time"), oldest first,
        bucketed by the enrollment's UTC day. Same access rule as GET /analytics/courses/{id}:
        admins any course, an instructor only a course they own, a student only a course they are enrolled in, otherwise 404.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties: { day: { type: string, format: date }, count: { type: integer } }

  /enrollments:
    get:
      summary: List the current student's enrollments
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: OK } }
    post:
      parameters:
      - { $ref: '#/components/parameters/IdempotencyKey' }
      summary: Enroll in a course (RFC §8.1, ADR-0012)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [course_id], properties: { course_id: { type: string, format: uuid } } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Enrollment' } } } }
        '409': { description: "already_enrolled | course_full | course_not_published | prerequisite_not_met", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /enrollments/{id}:
    get:
      summary: Get an enrollment (owner only)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Enrollment' } } } }
        '403': { description: Not your enrollment, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      summary: Withdraw (owner only)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: No Content } }

  /enrollments/{id}/progress:
    get:
      summary: Get lesson-level progress for an enrollment (owner only)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: OK } }

  /enrollments/{id}/lessons/{lessonKey}/complete:
    put:
      summary: Mark a lesson complete (idempotent, RFC §8.3). Transitions the enrollment to completed once every lesson in the current published version is done.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: lessonKey, in: path, required: true, schema: { type: string, format: uuid }, description: "lessons.lesson_key — NOT lessons.id (ADR-0011)" }
      responses:
        '204': { description: No Content }
        '404': { description: "Enrollment not found or not yours, or lessonKey is not a lesson of the published version (lesson_not_found). Previously 204 for an unknown key.", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /certificates:
    get:
      summary: List the current student's certificates, newest first (RFC §8.4)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Certificate' } } } } } } }
        '401': { description: Missing or invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /certificates/{id}:
    get:
      summary: Get one certificate (owner only). Another student's certificate answers exactly like an unknown id (DR-022).
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Certificate' } } } }
        '400': { description: Malformed id (validation_failed), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Missing or invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Unknown id or not yours (not_found), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /certificates/verify/{code}:
    get:
      summary: Verify a certificate by its verification code (public, no token; rate limited to 30 per minute per IP, RFC §8.4)
      description: >-
        Returns only the course title, the student name on the certificate and the issue date.
        Certificates are never revoked (RFC §8.4), so a 200 means the certificate was issued, not
        that the holder's enrollment is still complete.
      security: []
      parameters: [{ name: code, in: path, required: true, schema: { type: string, pattern: '^[A-Z2-7]{26}$' } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CertificateVerification' } } } }
        '400': { description: Malformed code (validation_failed), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Unknown code (not_found), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: Rate limited (rate_limited), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Optional client-chosen key (1-255 printable ASCII characters). A retry with the same
        key, user and request gets the stored 2xx response back with Idempotent-Replayed: true;
        the same key with a different request gets 422 idempotency_key_reused; a retry while the
        first request is still running gets 409 idempotency_request_in_progress. Stored for 24 hours.
      schema: { type: string, minLength: 1, maxLength: 255 }
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  schemas:
    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        details: {}

    RegisterRequest:
      type: object
      required: [email, password, full_name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        full_name: { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      properties: { email: { type: string, format: email }, password: { type: string } }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        full_name: { type: string }
        role: { type: string, enum: [student, instructor, admin] }
        email_verified_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    AuthResponse:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer }
        user: { $ref: '#/components/schemas/User' }

    CreateCourseRequest:
      type: object
      required: [title, slug]
      properties:
        title: { type: string }
        slug: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        description: { type: string }
        category: { type: string, nullable: true }
        level: { type: string, enum: [beginner, intermediate, advanced], nullable: true }
        enrollment_limit: { type: integer, nullable: true, minimum: 1 }

    UpdateDraftRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: string }
        category: { type: string, nullable: true }
        level: { type: string, enum: [beginner, intermediate, advanced], nullable: true }
        tags: { type: array, items: { type: string } }

    UploadURLRequest:
      type: object
      required: [course_id, content_type, size_bytes]
      description: There is deliberately no filename or key field; unknown fields are ignored.
      properties:
        course_id: { type: string, format: uuid }
        lesson_id: { type: string, format: uuid, nullable: true, description: "Scope the key to a lesson of the course's draft" }
        content_type: { type: string, enum: [video/mp4, video/webm, application/pdf, image/png, image/jpeg] }
        size_bytes: { type: integer, format: int64, minimum: 1, description: "Exact size of the file that will be uploaded; capped per content type" }

    UploadURL:
      type: object
      properties:
        upload_url: { type: string, description: Pre-signed PUT URL }
        method: { type: string, enum: [PUT] }
        headers: { type: object, additionalProperties: { type: string }, description: Headers to send verbatim (they are signed) }
        asset_key: { type: string, description: "Server-generated key: courses/{course_id}/assets/{id}.{ext} or courses/{course_id}/lessons/{lesson_id}/{id}.{ext}" }
        expires_at: { type: string, format: date-time }
        max_size_bytes: { type: integer, format: int64, description: Maximum size for this content type }

    CreateLessonRequest:
      type: object
      required: [title, position, content_type]
      properties:
        title: { type: string }
        position: { type: integer, minimum: 1 }
        content_type: { type: string, enum: [video, text, pdf, link] }
        content: { type: object }
        asset_key: { type: string, nullable: true, description: "A key issued by POST /assets/upload-url for this course; anything else is 400 invalid_asset_key. Existence, type and size are verified at publish." }
        duration_s: { type: integer, minimum: 0 }

    UpdateModuleRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }

    UpdateLessonRequest:
      type: object
      required: [title, content_type]
      properties:
        title: { type: string }
        content_type: { type: string, enum: [video, text, pdf, link] }
        content: { type: object, nullable: true, description: "Omitted or null leaves stored content unchanged; any other value, including {}, replaces it" }
        duration_s: { type: integer, minimum: 0 }

    Lesson:
      type: object
      properties:
        id: { type: string, format: uuid }
        lesson_key: { type: string, format: uuid, description: "Stable across versions (ADR-0011) — use this, not id, for the completion endpoint" }
        position: { type: integer }
        title: { type: string }
        content_type: { type: string }
        content: { type: object }
        duration_s: { type: integer }

    Version:
      type: object
      properties:
        id: { type: string, format: uuid }
        state: { type: string, enum: [draft, publishing, ready, publish_failed, superseded] }
        title: { type: string }
        description: { type: string }
        category: { type: string, nullable: true }
        level: { type: string, nullable: true }
        tags: { type: array, items: { type: string } }

    PublishAccepted:
      type: object
      properties:
        workflow_id: { type: string }
        state: { type: string, enum: [publishing] }

    PublishStatus:
      type: object
      properties:
        workflow_id: { type: string, nullable: true }
        state: { type: string, enum: [draft, publishing, ready, publish_failed, superseded] }
        error: { type: string, nullable: true, description: Set only when state is publish_failed }

    SearchResult:
      type: object
      properties:
        course_id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        instructor_name: { type: string }
        category: { type: string, nullable: true }
        level: { type: string, nullable: true }
        enrollment_count: { type: integer }

    PlatformSnapshot:
      type: object
      properties:
        total_students: { type: integer }
        total_instructors: { type: integer }
        total_courses_published: { type: integer }
        avg_courses_per_student: { type: number }

    CourseStats:
      type: object
      properties:
        total_enrollments: { type: integer }
        active_enrollments: { type: integer }
        completions: { type: integer }
        completion_rate: { type: number }
        avg_completion_s: { type: integer, nullable: true, description: Null until at least one student has completed the course }

    CourseDetail:
      type: object
      properties:
        course: { type: object }
        version: { $ref: '#/components/schemas/Version' }
        modules:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              position: { type: integer }
              title: { type: string }
              lessons: { type: array, items: { $ref: '#/components/schemas/Lesson' } }

    CatalogueResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              course_id: { type: string, format: uuid }
              slug: { type: string }
              title: { type: string }
              instructor_name: { type: string }
              category: { type: string, nullable: true }
              level: { type: string, nullable: true }
              enrollment_count: { type: integer }
        next_cursor: { type: string, nullable: true }

    Enrollment:
      type: object
      properties:
        id: { type: string, format: uuid }
        course_id: { type: string, format: uuid }
        status: { type: string, enum: [active, completed, withdrawn] }
        enrolled_at: { type: string, format: date-time }
        withdrawn_at: { type: string, format: date-time, nullable: true }

    Certificate:
      type: object
      properties:
        id: { type: string, format: uuid }
        enrollment_id: { type: string, format: uuid }
        course_id: { type: string, format: uuid }
        course_version_id: { type: string, format: uuid, nullable: true }
        course_title: { type: string, description: "Snapshot at issue time (RFC §8.4)" }
        student_name: { type: string, description: "Snapshot at issue time (RFC §8.4)" }
        verification_code: { type: string, pattern: '^[A-Z2-7]{26}$' }
        issued_at: { type: string, format: date-time }

    CertificateVerification:
      type: object
      properties:
        course_title: { type: string }
        student_name: { type: string }
        issued_at: { type: string, format: date-time }
